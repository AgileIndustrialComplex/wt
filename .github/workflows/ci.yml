name: CI

on:
  push:
    branches: [essa]
    tags: ["v*"]
  pull_request:
    branches: [essa]

permissions:
  contents: read

env:
  GO_VERSION: "1.24.2"

jobs:
  # --- Setup / static checks -------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting (gofmt)
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6

  # --- Build -------------------------------------------------------------------
  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: make build

  # --- Test ----------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test (race + coverage)
        run: make test-race

  # --- Deploy / Release ------------------------------------------------------
  # Runs only on version tags. Fill in the placeholders below with the
  # project's actual release process (e.g. goreleaser, `go install`
  # publishing, container push, etc.) once it is decided.
  deploy:
    name: Deploy
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Deploy / release
        run: <DEPLOY_COMMAND>  # e.g. `goreleaser release --clean`
        env:
          # <DEPLOY_SECRET_NAME>: ${{ secrets.<DEPLOY_SECRET_NAME> }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
